# Self-contained targets for every prober so probes never leave the host.
name: blackbox-local

services:
  blackbox:
    build:
      context: ../..
      dockerfile: examples/local/Dockerfile
    image: blackbox-exporter:local
    command:
      - --config.file=/etc/blackbox_exporter/local.yml
    ports:
      - "127.0.0.1:${BLACKBOX_PORT:-9115}:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/local.yml:ro
      - certs:/certs:ro
    # Raw ICMP sockets need NET_RAW, which hardened runtimes drop by default.
    cap_add:
      - NET_RAW
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 2s
      retries: 15

  certs:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "/gen.sh", "/certs"]
    volumes:
      - ./certs/gen.sh:/gen.sh:ro
      - certs:/certs

  web:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      retries: 15

  mail:
    image: axllent/mailpit:v1.27
    command:
      - --smtp-tls-cert=/certs/server.crt
      - --smtp-tls-key=/certs/server.key
      - --smtp-auth-accept-any
    volumes:
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully

  dns:
    image: coredns/coredns:1.12.4
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns:/etc/coredns:ro
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully

  websocket:
    image: jmalloc/echo-server:v0.3.7

  echo:
    image: busybox:1.37
    command: ["nc", "-lk", "-p", "7", "-e", "cat"]

  grpc:
    image: quay.io/coreos/etcd:v3.5.21
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://grpc:2379

volumes:
  certs:
